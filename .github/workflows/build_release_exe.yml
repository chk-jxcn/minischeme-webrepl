name: Build and Release WebREPL Standalone Exe

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow fonttools cryptography

      - name: Run Test Suite
        run: |
          python -m unittest tests/test_webrepl_features.py -v

      - name: Build MiniScheme-WebREPL.exe
        run: |
          python tools/build_exe.py

      - name: Verify MiniScheme-WebREPL.exe starts and binds port
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/MiniScheme-WebREPL.exe" -ArgumentList "--no-tray", "--port", "18087" -PassThru
          Start-Sleep -Seconds 3
          $resp = Invoke-RestMethod -Uri "http://127.0.0.1:18087/api/server_info" -TimeoutSec 5
          Write-Host "Server Info:" ($resp | ConvertTo-Json -Compress)
          if (-not $resp.success -or $resp.port -ne 18087) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "MiniScheme-WebREPL.exe verification failed"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Determine Release Tag
        id: rel_tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v1.0.${{ github.run_number }}"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing release tag: $tag"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniScheme-WebREPL-Windows-Exe
          path: dist/MiniScheme-WebREPL.exe

      - name: Publish Latest GitHub Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_tag.outputs.tag }}
          name: "MiniScheme WebREPL & Local Server ${{ steps.rel_tag.outputs.tag }}"
          make_latest: true
          body: |
            ## MiniScheme WebREPL Local Server (Windows Standalone Tray Executable)
            - **`MiniScheme-WebREPL.exe`**: Single-file standalone Windows application packaged from `server.py` (includes WebREPL static assets, WASM compiler/simulator, App Proxy, Protocol Converter, and Font Generator).
            - **Bundled Fonts**: Built-in 16px/12px SimSun (宋体) and 16px SimHei (黑体) GB2312 dot-matrix fonts for instant one-click installation to hardware Font ROM.
            - **Integrated Proxy Admin & User Portals**: Right-click tray menu options or WebREPL header/toolbar buttons to launch the Proxy Admin Portal (`/admin`) and Device Owner Portal (`/user`) for audit, tenant inspection, and pre-configuration.
            - **Default Port & Auto-Fallback**: Listens on port `8087` by default; automatically switches to the next available port (`8088`, `8089`, ...) if `8087` is already in use.
            - **System Tray Integration**: Displays the local LAN IP and listening port in the Windows system tray; left-click to open WebREPL, right-click to launch Proxy Admin, copy LAN proxy URL, or exit.
          files: |
            dist/MiniScheme-WebREPL.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
