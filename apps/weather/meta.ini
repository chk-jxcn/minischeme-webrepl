[app]
id = weather
name = 天气预报
description = 当前位置的实况、3天/7天预报、24小时气温、未来5小时与2小时降水、空气质量和生活指数
version = 1
pages = 5
api = 1.0 ; the device API it needs (docs/api): runs on firmware API 1.x, x >= 0

[fields]
; how the settings page shows each [config] key: type | label | help
; types: text, number:min-max, bool, select:value=label,value=label
; (no ASCII ; or # in these lines: they start a comment)
location = text | 位置 | auto 表示按公网 IP 定位，也可以填城市名（深圳）或 经度,纬度
qweather_key = text | 和风天气 Key | 和风控制台的 API Key。留空时用代理电脑上配置的 Key（tools/app_proxy.local.ini），都没有则用 Open-Meteo
qweather_host = text | 和风 API Host | 和风控制台“设置”页里的 API Host，如 xxxx.re.qweatherapi.com。留空同上
carousel = bool | 自动翻页 | 打开后按下面的时长依次显示各页
carousel_seconds = text | 每页秒数 | 一个值，或每页一个，如 15,10,10（后面的页沿用最后一个值）

[config]
location = auto ; auto (city of the public IP), a city name (深圳) or lon,lat
qweather_key = ; QWeather (和风天气) API key; empty: the proxy's own (tools/app_proxy.local.ini), else Open-Meteo
qweather_host = ; QWeather API Host (console > settings); empty: the proxy's own
carousel = 0 ; 1: turn the pages by themselves
carousel_seconds = 10 ; seconds per page, or one per page: 15,10,10 (the last repeats)
proxy_url = http://proxy.local:8087
converter_url = http://converter.local:8087
