[app]
pages = 1
page_ids = meds ; English page names: <app>.<id> in a combined app (front: the first)
id = medicine
name = 吃药提醒
description = 按设定的时间点自动弹出吃药提醒：显示药品照片、名称和数量，逐个按键确认后回到原来的应用；支持每天几次、隔日服药。在设备网页的应用选项卡设置时间和药品；不需要代理
version = 1
storage_kb = 512 ; the medicines' photos in the app's folder (instead of app_storage_kb)

[fields]
; how the settings page shows each [config] key: type | label | help
; types: text, number:min-max, bool, select:value=label,value=label
; (no ASCII ; or # in these lines: they start a comment)
name_scale = select:1=1 倍（16 像素）,2=2 倍,3=3 倍,4=4 倍 | 提醒时药名大小 | 药名太长时自动缩小到放得下
qty_scale = select:1=1 倍（16 像素）,2=2 倍,3=3 倍 | 提醒时数量大小 | 提醒画面上“数量”一行
list_scale = select:1=1 倍（16 像素）,2=2 倍,3=3 倍 | 平时药名大小 | 轮流显示药品时的药名

[config]
name_scale = 2 ; the reminder's medicine name: a multiple of the 16 px font (1..4)
qty_scale = 1 ; the reminder's quantity (1..3)
list_scale = 1 ; the name in normal mode (1..3)
proxy_url = ; Application proxy service URL (empty: use system config.ini)
converter_url = ; Protocol converter URL (empty: use system config.ini)
