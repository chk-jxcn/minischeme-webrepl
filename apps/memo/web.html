<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>备忘录</title>
<!-- appweb -->
<style>
.memo .text{white-space:pre-wrap}
.memo.done .text{color:var(--muted);text-decoration:line-through}
.memo.pinned{border-left:3px solid var(--accent);padding-left:8px}
.tabs button{margin:0 6px 0 0}
.tabs button.on{background:#173f52;border-color:var(--accent)}
.tabs button:not(.on){background:transparent;border-color:var(--line)}
</style>
</head>
<body>
<main>
<section>
<h2>新备忘</h2>
<textarea id="text" maxlength="300" placeholder="要记的事（最多 300 字节，约 100 个汉字）"></textarea>
<label><input type="checkbox" id="pin">置顶</label>
<button onclick="add()">添加</button>
<span class="desc">Ctrl+Enter 添加</span>
</section>

<section>
<div class="tabs"><button id="t-todo" class="on" onclick="show(false)">待办</button><button id="t-done" onclick="show(true)">已完成</button>
<button class="plain small" id="clear" style="display:none" onclick="clearDone()">清除已完成</button></div>
<div id="list" class="desc" style="margin-top:8px">读取中...</div>
</section>
</main>
<script>
let memos = [], showDone = false, editing = 0;

function render() {
  $('t-todo').classList.toggle('on', !showDone);
  $('t-done').classList.toggle('on', showDone);
  const todo = memos.filter((m) => !m.done), done = memos.filter((m) => m.done);
  $('t-todo').textContent = `待办 ${todo.length}`;
  $('t-done').textContent = `已完成 ${done.length}`;
  $('clear').style.display = showDone && done.length ? '' : 'none';
  const list = showDone ? done : todo;
  $('list').className = list.length ? '' : 'desc';
  $('list').innerHTML = list.map((m) => editing === m.id ? `
    <div class="item"><div class="grow">
      <textarea id="edit" maxlength="300">${esc(m.text)}</textarea>
      <button onclick="save(${m.id})">保存</button><button class="plain" onclick="editing=0;render()">取消</button>
    </div></div>` : `
    <div class="item memo${m.done ? ' done' : ''}${m.pinned ? ' pinned' : ''}">
      <div class="grow"><div class="text">${esc(m.text)}</div>
        <div class="desc">${esc(m.time || '')}${m.pinned ? '<span class="tag">置顶</span>' : ''}</div></div>
      <div>
        <button class="small" onclick="act('done', ${m.id})">${m.done ? '恢复' : '完成'}</button>
        ${m.done ? '' : `<button class="small plain" onclick="act('pin', ${m.id})">${m.pinned ? '取消置顶' : '置顶'}</button>`}
        <button class="small plain" onclick="editing=${m.id};render()">编辑</button>
        <button class="small plain" onclick="del(${m.id})">删除</button>
      </div>
    </div>`).join('') || (showDone ? '没有已完成的备忘' : '暂无备忘，在上面添加');
}

function take(r) { memos = r.memos || []; render(); }

function show(done) { showDone = done; editing = 0; render(); }

async function load() { await attempt(async () => take(await appCall('list'))); }

async function add() {
  const text = $('text').value.trim();
  if (!text) return say('先写点内容', 'warn');
  await attempt(async () => {
    take(await appCall('add', {text, pin: $('pin').checked ? '1' : '0'}));
    $('text').value = '';
    $('pin').checked = false;
    showDone = false;
    render();
    say('已添加，设备屏幕已更新', 'ok');
  });
}

async function act(name, id) { await attempt(async () => take(await appCall(name, {id}))); }

async function save(id) {
  const text = $('edit').value.trim();
  if (!text) return say('内容不能为空', 'warn');
  await attempt(async () => { take(await appCall('edit', {id, text})); editing = 0; render(); });
}

async function del(id) {
  if (!confirm('删除这条备忘？')) return;
  await act('delete', id);
}

async function clearDone() {
  if (!confirm('清除全部已完成的备忘？')) return;
  await attempt(async () => take(await appCall('clear-done')));
}

$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.ctrlKey) add(); });
load();
</script>
</body>
</html>
