<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电子相册</title>
<!-- appweb -->
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:8px}
.ph{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:12px;color:var(--muted)}
.ph.cur{border-color:var(--accent)}
.ph .box{height:120px;display:flex;align-items:center;justify-content:center;background:#000;border-radius:4px;overflow:hidden}
.ph img{max-width:100%;max-height:120px}
.ph button.small{margin:4px 2px 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px}
#prog{margin-top:8px}
</style>
</head>
<body>
<main>
<section>
<h2>上传照片</h2>
<input type="file" id="files" multiple accept="image/*,.gif,.webp">
<div class="opts">
<label><input type="checkbox" id="rotate"> 横向照片旋转 90° 充满屏幕</label>
<div><label for="quality">画质</label>
<select id="quality"><option value="0.9">高（约 40 KB 一张）</option><option value="0.82" selected>中（约 25 KB）</option><option value="0.7">省空间（约 15 KB）</option></select></div>
<div><label for="aside">动图最大边长（越大越慢）</label>
<select id="aside"><option value="160">160 像素</option><option value="240" selected>240 像素</option><option value="320">320 像素</option></select></div>
<div><label for="aframes">动图最多帧数</label>
<select id="aframes"><option value="40">40 帧</option><option value="80" selected>80 帧</option><option value="150">150 帧</option></select></div>
</div>
<button onclick="upload()">上传</button>
<div class="desc">图片在浏览器里转换成屏幕大小（320×480）的 JPEG 再上传；GIF 动图逐帧转换并保存帧间隔，在设备上播放。动态 WebP / PNG 只在支持 ImageDecoder 的页面（HTTPS）里逐帧转换，否则保存第一帧。</div>
<div id="prog" class="desc"></div>
</section>

<section>
<h2>照片 <span id="count" class="tag"></span>
<button class="plain small" onclick="load()">刷新</button></h2>
<div id="list" class="desc">读取中...</div>
</section>

<section>
<h2>播放设置</h2>
<div class="opts">
<label><input type="checkbox" id="s_slideshow"> 自动轮播</label>
<div><label for="s_interval">轮播间隔（秒，3–3600）</label><input id="s_interval" type="number" min="3" max="3600"></div>
<div><label for="s_order">顺序</label><select id="s_order"><option value="seq">按上传顺序</option><option value="random">随机</option></select></div>
<label><input type="checkbox" id="s_gif_play"> 播放动图（关闭后只显示第一帧）</label>
<div><label for="s_gif_speed">动图速度</label>
<select id="s_gif_speed"><option value="25">0.25 倍</option><option value="50">0.5 倍</option><option value="100">原速</option><option value="200">2 倍</option><option value="400">4 倍</option></select></div>
<label><input type="checkbox" id="s_show_info"> 在底部显示第几张和时间</label>
</div>
<button onclick="saveSettings()">保存设置</button>
<button class="plain" id="pausebtn" onclick="togglePause()">暂停轮播</button>
</section>
</main>
<script>
const SCREEN_W = 320, SCREEN_H = 480;
let photos = [], current = 0, paused = false, thumbs = {};

/* ---- the board's list and settings ---- */
function take(r) {
  photos = r.photos || [];
  current = r.index || 0;
  paused = !!r.paused;
  const s = r.settings || {};
  const on = (v) => /^(1|on|yes|true)$/i.test(v || '');
  $('s_slideshow').checked = on(s.slideshow);
  $('s_interval').value = s.interval || '10';
  $('s_order').value = s.order || 'seq';
  $('s_gif_play').checked = on(s.gif_play);
  $('s_gif_speed').value = s.gif_speed || '100';
  $('s_show_info').checked = on(s.show_info);
  $('pausebtn').textContent = paused ? '继续轮播' : '暂停轮播';
  render();
}

function render() {
  const total = photos.reduce((a, p) => a + (p.size || 0), 0);
  $('count').textContent = photos.length ? `${photos.length} 张，${(total / 1024).toFixed(0)} KB` : '';
  $('list').className = photos.length ? '' : 'desc';
  $('list').innerHTML = photos.length ? '<div class="grid">' + photos.map((p, i) => `
    <div class="ph${i === current ? ' cur' : ''}">
      <div class="box">${thumbs[p.name] ? `<img src="${thumbs[p.name]}" alt="">` : '…'}</div>
      <div>${i + 1}. ${p.w}×${p.h}${p.frames > 1 ? ` · 动图 ${p.frames} 帧` : ''}${p.w ? '' : ' · <span class="bad">无法显示</span>'}</div>
      <div>${(p.size / 1024).toFixed(0)} KB</div>
      <button class="small" onclick="showPhoto('${esc(p.name)}')">显示</button>
      <button class="small plain" onclick="del('${esc(p.name)}')">删除</button>
    </div>`).join('') + '</div>' : '还没有照片，在上面选择文件上传';
  loadThumbs();
}

/* Thumbnails from the board: a JPEG as is, an animation's first frame */
async function loadThumbs() {
  for (const p of photos) {
    if (thumbs[p.name] || !p.w) continue;
    try {
      let blob = await appFile('photos/' + p.name);
      if (p.name.endsWith('.mani')) {
        const buf = await blob.arrayBuffer(), dv = new DataView(buf);
        blob = new Blob([buf.slice(dv.getUint32(12, true), dv.getUint32(12, true) + dv.getUint32(16, true))],
                        {type: 'image/jpeg'});
      }
      thumbs[p.name] = URL.createObjectURL(blob);
      render();
      return;   /* render() goes on with the next one */
    } catch (e) { thumbs[p.name] = ''; }
  }
}

async function load() { await attempt(async () => take(await appCall('list'))); }

async function showPhoto(name) { await attempt(async () => take(await appCall('show', {name}))); }

async function del(name) {
  if (!confirm('删除这张照片？')) return;
  await attempt(async () => {
    await appFileDelete('photos/' + name);
    if (thumbs[name]) URL.revokeObjectURL(thumbs[name]);
    delete thumbs[name];
    take(await appCall('list'));
    say('已删除', 'ok');
  });
}

async function saveSettings() {
  const iv = parseInt($('s_interval').value, 10);
  if (!(iv >= 3 && iv <= 3600)) return say('轮播间隔：3–3600 秒', 'warn');
  await attempt(async () => {
    take(await appCall('settings', {
      slideshow: $('s_slideshow').checked ? '1' : '0', interval: String(iv), order: $('s_order').value,
      gif_play: $('s_gif_play').checked ? '1' : '0', gif_speed: $('s_gif_speed').value,
      show_info: $('s_show_info').checked ? '1' : '0'}));
    say('设置已保存，设备已更新', 'ok');
  });
}

async function togglePause() { await attempt(async () => take(await appCall('pause', {on: paused ? '0' : '1'}))); }

/* ---- conversion in the browser ---- */
/* The size it is drawn at: within maxW x maxH, never enlarged; rot: turned 90 degrees */
function fit(w, h, maxW, maxH, rot) {
  const sw = rot ? h : w, sh = rot ? w : h;
  const k = Math.min(maxW / sw, maxH / sh, 1);
  return {w: Math.max(1, Math.round(sw * k)), h: Math.max(1, Math.round(sh * k))};
}

/* src (an image, bitmap or video frame of sw x sh) drawn into a w x h canvas */
function drawTo(canvas, src, sw, sh, size, rot) {
  canvas.width = size.w;
  canvas.height = size.h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, size.w, size.h);
  ctx.imageSmoothingQuality = 'high';
  if (rot) {
    ctx.save();
    ctx.translate(size.w, 0);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(src, 0, 0, sw, sh, 0, 0, size.h, size.w);
    ctx.restore();
  } else {
    ctx.drawImage(src, 0, 0, sw, sh, 0, 0, size.w, size.h);
  }
}

function jpeg(canvas, q) {
  return new Promise((ok, fail) => canvas.toBlob((b) => b ? ok(b) : fail(new Error('JPEG 编码失败')), 'image/jpeg', q));
}

async function convertStill(file, q, rotate) {
  const bmp = await createImageBitmap(file, {imageOrientation: 'from-image'});
  const rot = rotate && bmp.width > bmp.height;
  const size = fit(bmp.width, bmp.height, SCREEN_W, SCREEN_H, rot), c = document.createElement('canvas');
  drawTo(c, bmp, bmp.width, bmp.height, size, rot);
  bmp.close();
  return {blob: await jpeg(c, q), ext: 'jpg', frames: 1, size};
}

/* ---- GIF frames without ImageDecoder (the board's page is plain HTTP, where
 * browsers have no WebCodecs): LZW, interlacing, transparency and the
 * disposal methods, composed the way browsers show them ---- */
function gifLzw(data, minCode, n) {
  const out = new Uint8Array(n), clear = 1 << minCode, eoi = clear + 1;
  const prefix = new Uint16Array(4096), suffix = new Uint8Array(4096), stack = new Uint8Array(4097);
  for (let i = 0; i < clear; i++) suffix[i] = i;
  let size = minCode + 1, mask = (1 << size) - 1, next = eoi + 1, old = -1, first = 0;
  let acc = 0, bits = 0, pos = 0, o = 0;
  while (o < n) {
    while (bits < size) {
      if (pos >= data.length) return out;
      acc |= data[pos++] << bits;
      bits += 8;
    }
    let code = acc & mask;
    acc >>>= size;
    bits -= size;
    if (code === clear) {
      size = minCode + 1; mask = (1 << size) - 1; next = eoi + 1; old = -1;
      continue;
    }
    if (code === eoi) break;
    if (old === -1) {
      out[o++] = suffix[code];
      old = first = code;
      continue;
    }
    const cur = code;
    let sp = 0;
    if (code >= next) { stack[sp++] = first; code = old; }   /* the code being defined (KwKwK) */
    while (code >= clear) { stack[sp++] = suffix[code]; code = prefix[code]; }
    first = suffix[code];
    stack[sp++] = first;
    while (sp && o < n) out[o++] = stack[--sp];
    if (next < 4096) {
      prefix[next] = old;
      suffix[next] = first;
      next++;
      if (next > mask && size < 12) { size++; mask = (1 << size) - 1; }
    }
    old = cur;
  }
  return out;
}

/* Frames of a GIF: yields {rgba (w*h*4, valid until the next frame), delay ms}; .w .h .count */
function gifInfo(buf) {
  const b = new Uint8Array(buf);
  if (!/^GIF8[79]a$/.test(String.fromCharCode(...b.subarray(0, 6)))) throw new Error('不是 GIF 文件');
  let p = 13, count = 0;
  if (b[10] & 0x80) p += 3 * (2 << (b[10] & 7));
  while (p < b.length && b[p] !== 0x3B) {
    if (b[p] === 0x21) {
      p += 2;
    } else if (b[p] === 0x2C) {
      count++;
      const f = b[p + 9];
      p += 10;
      if (f & 0x80) p += 3 * (2 << (f & 7));
      p++;   /* LZW minimum code size */
    } else {
      break;
    }
    while (p < b.length && b[p] !== 0) p += b[p] + 1;
    p++;
  }
  return {b, w: b[6] | b[7] << 8, h: b[8] | b[9] << 8, count};
}

function* gifFrames(info) {
  const {b, w, h} = info;
  let p = 13, gct = null;
  if (b[10] & 0x80) { const n = 2 << (b[10] & 7); gct = b.subarray(p, p + 3 * n); p += 3 * n; }
  const canvas = new Uint8ClampedArray(w * h * 4);
  let gce = {delay: 0, disposal: 0, transparent: -1};
  while (p < b.length) {
    const block = b[p++];
    if (block === 0x3B) return;
    if (block === 0x21) {
      const label = b[p++];
      if (label === 0xF9 && b[p] >= 4) {
        const f = b[p + 1];
        gce = {disposal: (f >> 2) & 7, delay: (b[p + 2] | b[p + 3] << 8) * 10, transparent: (f & 1) ? b[p + 4] : -1};
      }
      while (p < b.length && b[p] !== 0) p += b[p] + 1;
      p++;
      continue;
    }
    if (block !== 0x2C) return;
    const fx = b[p] | b[p + 1] << 8, fy = b[p + 2] | b[p + 3] << 8, fw = b[p + 4] | b[p + 5] << 8;
    const fh = b[p + 6] | b[p + 7] << 8, ff = b[p + 8];
    p += 9;
    let ct = gct;
    if (ff & 0x80) { const n = 2 << (ff & 7); ct = b.subarray(p, p + 3 * n); p += 3 * n; }
    const minCode = b[p++];
    const parts = [];
    let len = 0;
    while (p < b.length && b[p] !== 0) { parts.push(b.subarray(p + 1, p + 1 + b[p])); len += b[p]; p += b[p] + 1; }
    p++;
    const data = new Uint8Array(len);
    let k = 0;
    for (const part of parts) { data.set(part, k); k += part.length; }
    const idx = gifLzw(data, minCode, fw * fh);
    /* interlaced rows come in four passes */
    const rows = [];
    if (ff & 0x40) {
      for (const [start, step] of [[0, 8], [4, 8], [2, 4], [1, 2]]) for (let y = start; y < fh; y += step) rows.push(y);
    } else {
      for (let y = 0; y < fh; y++) rows.push(y);
    }
    const saved = gce.disposal === 3 ? canvas.slice() : null;
    rows.forEach((row, i) => {
      const y = fy + row;
      if (y >= h) return;
      for (let x = 0; x < fw && fx + x < w; x++) {
        const c = idx[i * fw + x];
        if (c === gce.transparent || !ct || c * 3 + 2 >= ct.length) continue;
        const o = (y * w + fx + x) * 4;
        canvas[o] = ct[c * 3]; canvas[o + 1] = ct[c * 3 + 1]; canvas[o + 2] = ct[c * 3 + 2]; canvas[o + 3] = 255;
      }
    });
    yield {rgba: canvas, delay: gce.delay};
    if (gce.disposal === 2) {
      for (let y = fy; y < Math.min(h, fy + fh); y++) canvas.fill(0, (y * w + fx) * 4, (y * w + Math.min(w, fx + fw)) * 4);
    } else if (saved) {
      canvas.set(saved);
    }
    gce = {delay: 0, disposal: 0, transparent: -1};
  }
}

/* The frames of an animation, one at a time: {count, next(): {src, w, h, delay} | null, close()};
 * ImageDecoder where the browser has it (GIF, WebP, APNG), else GIFs by gifFrames; null: no animation */
async function animationSource(file) {
  const gif = /gif/i.test(file.type) || /\.gif$/i.test(file.name);
  if ('ImageDecoder' in window && file.type && await ImageDecoder.isTypeSupported(file.type)) {
    const dec = new ImageDecoder({data: await file.arrayBuffer(), type: file.type});
    await dec.tracks.ready;
    let k = 0, last = null;
    return {count: dec.tracks.selectedTrack.frameCount,
      next: async () => {
        if (last) last.close();
        if (k >= dec.tracks.selectedTrack.frameCount) return null;
        const {image} = await dec.decode({frameIndex: k++});
        last = image;
        return {src: image, w: image.displayWidth, h: image.displayHeight, delay: image.duration ? image.duration / 1000 : 100};
      },
      close: () => { if (last) last.close(); dec.close(); }};
  }
  if (!gif) return null;
  const info = gifInfo(await file.arrayBuffer());
  const it = gifFrames(info), c = document.createElement('canvas');
  c.width = info.w;
  c.height = info.h;
  const cx = c.getContext('2d');
  return {count: info.count,
    next: async () => {
      const r = it.next();
      if (r.done) return null;
      cx.putImageData(new ImageData(r.value.rgba, info.w, info.h), 0, 0);
      return {src: c, w: info.w, h: info.h, delay: r.value.delay || 100};
    },
    close: () => {}};
}

/* An animation as a MANI file of JPEG frames (minischeme_image.h); null when
 * it is not one (a single frame, or a format this browser cannot split) */
async function convertAnimation(file, q, rotate, maxSide, maxFrames, progress) {
  const src = await animationSource(file);
  if (!src) return null;
  try {
    if (src.count < 2) return null;
    const step = Math.ceil(src.count / maxFrames);   /* too many frames: every step-th, delays added up */
    const frames = [];
    let size = null, rot = false, f;
    const c = document.createElement('canvas');
    for (let i = 0; (f = await src.next()); i++) {
      if (i % step === 0) {
        if (!size) {
          rot = rotate && f.w > f.h;
          size = fit(f.w, f.h, Math.min(SCREEN_W, maxSide), Math.min(SCREEN_H, maxSide), rot);
        }
        drawTo(c, f.src, f.w, f.h, size, rot);
        frames.push({data: new Uint8Array(await (await jpeg(c, q)).arrayBuffer()), delay: 0});
        progress(`${frames.length} / ${Math.ceil(src.count / step)} 帧`);
      }
      frames[frames.length - 1].delay += f.delay;
    }
    /* "MANI" | 1 | 0 | w | h | n, then per frame offset, length, delay, then the JPEGs */
    const n = frames.length, head = 12 + 10 * n;
    const out = new Uint8Array(head + frames.reduce((a, fr) => a + fr.data.length, 0));
    const dv = new DataView(out.buffer);
    out.set([0x4d, 0x41, 0x4e, 0x49, 1, 0]);
    dv.setUint16(6, size.w, true);
    dv.setUint16(8, size.h, true);
    dv.setUint16(10, n, true);
    let at = head;
    frames.forEach((fr, i) => {
      dv.setUint32(12 + 10 * i, at, true);
      dv.setUint32(16 + 10 * i, fr.data.length, true);
      dv.setUint16(20 + 10 * i, Math.min(65535, Math.round(fr.delay)), true);
      out.set(fr.data, at);
      at += fr.data.length;
    });
    return {blob: new Blob([out]), ext: 'mani', frames: n, size};
  } finally {
    src.close();
  }
}

async function upload() {
  const files = [...$('files').files];
  if (!files.length) return say('先选择图片文件', 'warn');
  const q = parseFloat($('quality').value), rotate = $('rotate').checked;
  const maxSide = parseInt($('aside').value, 10), maxFrames = parseInt($('aframes').value, 10);
  let done = 0, failed = 0;
  for (const [i, file] of files.entries()) {
    const tag = `${i + 1} / ${files.length} ${file.name}`;
    try {
      $('prog').textContent = `转换 ${tag}…`;
      let out = /gif|webp|png/i.test(file.type)
        ? await convertAnimation(file, q, rotate, maxSide, maxFrames, (t) => { $('prog').textContent = `转换 ${tag}：${t}`; })
        : null;
      if (!out) out = await convertStill(file, q, rotate);
      $('prog').textContent = `上传 ${tag}（${(out.blob.size / 1024).toFixed(0)} KB）…`;
      await appFileWrite(`photos/p${Date.now()}${i % 10}.${out.ext}`, out.blob);
      done++;
    } catch (e) {
      failed++;
      say(`${file.name}：${e.message}`, 'bad');
      if (/storage is full|空间/.test(e.message)) break;
    }
  }
  $('prog').textContent = `已上传 ${done} 张` + (failed ? `，${failed} 张失败` : '');
  $('files').value = '';
  await load();
}

load();
</script>
</body>
</html>
