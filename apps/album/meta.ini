[app]
pages = 1
id = album
name = 电子相册
description = 全屏轮播照片和 GIF 动图：在设备网页的应用选项卡上传 JPG、PNG、GIF，设置轮播间隔、顺序和动图速度；不需要代理
version = 1
api = 1.5 ; the device API it needs (docs/api): runs on firmware API 1.x, x >= 5 (gui-image)
storage_kb = 768 ; the photos' room in the app's folder (instead of app_storage_kb)

[fields]
; how the settings page shows each [config] key: type | label | help
; types: text, number:min-max, bool, select:value=label,value=label
; (no ASCII ; or # in these lines: they start a comment)
slideshow = bool | 自动轮播 | 关闭后短按按键切换下一张
interval = number:3-3600 | 轮播间隔（秒） | 每张照片停留的秒数
order = select:seq=按上传顺序,random=随机 | 顺序 | 轮播时下一张怎么选
gif_play = bool | 播放动图 | 关闭后动图只显示第一帧
gif_speed = select:25=0.25 倍,50=0.5 倍,100=原速,200=2 倍,400=4 倍 | 动图速度 | 相对 GIF 自带的帧间隔
show_info = bool | 显示信息 | 在底部显示第几张、是否暂停和时间

[config]
slideshow = 1 ; 1: the next photo every interval seconds
interval = 10 ; seconds per photo (3..3600)
order = seq ; seq (upload order) or random
gif_play = 1 ; 1: animations play, 0: their first frame
gif_speed = 100 ; percent of the GIF's own frame delays (10..1000)
show_info = 0 ; 1: a strip at the bottom with the position and the time
proxy_url = ; Application proxy service URL (empty: use system config.ini)
converter_url = ; Protocol converter URL (empty: use system config.ini)
